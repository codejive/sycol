name: Tests
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Release version to test in place of the checked-in version
        type: string
        default: ''
jobs:
  bash:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: printf '%s\n' "$VERSION" > .sycol/VERSION
      - name: Bash version
        run: /bin/bash --version
      - name: Shared Tcl and process tests
        env:
          SYCOL_BASH: /bin/bash
        run: /bin/bash tests/run.sh
      - name: Execute launcher directly and through PATH
        run: |
          test -x ./sycol
          ./sycol examples/hello.tcl Alice
          PATH="$PWD:$PATH" sycol examples/hello.tcl Alice
  powershell:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Set release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: printf '%s\n' "$VERSION" > .sycol/VERSION
      - name: PowerShell version
        run: $PSVersionTable.PSVersion
      - name: Shared Tcl and process tests
        run: ./tests/run.ps1
  powershell-unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: printf '%s\n' "$VERSION" > .sycol/VERSION
      - name: Shared Tcl and process tests
        shell: pwsh
        run: ./tests/run.ps1
